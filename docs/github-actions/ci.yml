name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: pytest
      - name: Sample runbook
        run: |
          runbook-generator generate \
            --incident samples/payment_latency_incident.json \
            --runbooks samples/runbook_corpus.json \
            --output reports/payment_latency_runbook.json
          runbook-generator generate \
            --incident samples/payment_latency_incident.json \
            --runbooks samples/runbook_corpus.json \
            --format markdown \
            --output reports/payment_latency_runbook.md
      - name: Docker build
        run: docker build -f infra/docker/Dockerfile -t ai-incident-runbook-generator:ci .
      - name: Execution governance gate
        run: |
          set +e
          runbook-generator execution \
            --manifest samples/payment_execution_manifest.json \
            --output reports/payment_execution_review.json
          status=$?
          set -e
          test "$status" -eq 2
      - name: Runbook drill readiness gate
        run: |
          runbook-generator drill \
            --manifest samples/payment_drill_manifest.json \
            --output reports/payment_drill_readiness.json
