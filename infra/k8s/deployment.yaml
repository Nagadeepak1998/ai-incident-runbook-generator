apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-incident-runbook-generator
  labels:
    app: ai-incident-runbook-generator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ai-incident-runbook-generator
  template:
    metadata:
      labels:
        app: ai-incident-runbook-generator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
    spec:
      containers:
        - name: app
          image: ghcr.io/nagadeepak1998/ai-incident-runbook-generator:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL

